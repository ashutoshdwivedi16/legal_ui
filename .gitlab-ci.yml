variables:
  #IMAGE_NAME: "${DOCKER_REGISTRY}:${APP_NAME}-${CI_COMMIT_SHORT_SHA}"
  IMAGE_SCAN_MIN_PASS_VALUE: "5"
  APP_NAMESPACE: admin-service
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  IMAGESCANFAILMESSAGE: Image Scan Stage Failed, Please check Vulnerabilities
  JOB_NAME:
    value: ""
    options:
      - ""
      - "FE"
      - "BE"
      - "ALL"
    description: "Select the Pipeline job Name"



stages:
  - slack
  - lower-develop-env-merge
  - lower-qa-env-merge
  - unit-testing
  - fe-sonar-scanner
  - sonar-scanner
  - qa-approval
  - build
  - fe-dev-docker-image
  - fe-dev-deploy
  - be-dev-docker-image
  - be-dev-deploy
  - dev-swagger-upload
  - fe-qa-docker-image
  - fe-qa-deploy
  - be-qa-docker-image
  - be-qa-deploy
  - qa-swagger-upload
  - check_commit
  - fe-stg-docker-image
  - fe-stg-deploy
  - be-stg-deploy
  - check_commit_prod
  - fe-prd-docker-image
  - fe-prd-deploy

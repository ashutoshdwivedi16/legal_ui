QA Approval:
  stage: qa-approval
  rules:
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^lower-qa-sync\//'
      when: never 
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release-.*/'
      when: manual
    - when: never
  when: manual
  script:
    - apk add bash git
    - apk add --no-cache curl jq python3 py3-pip
    - pip3 install awscli
    - export AWS_PROFILE=lgcomus-shared
    - aws s3 ls 
    - export GITLAB_TOKEN=$(aws secretsmanager get-secret-value --secret-id SECRET-LGCOMUS-GITLAB-TOKEN --region us-east-1 --query SecretString --output text | jq '.GITLAB_PRIVATE_TOKEN'|sed 's/"//g')
    - env
    - |
      STATUS=$(curl -s -o /dev/null -w "%{http_code}" --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "https://gitlab-ce.lgcomus-shared.lge.com/api/v4/groups/795/members/all/$GITLAB_USER_ID")
      echo "STATUS: $STATUS"
      if [ "$STATUS" -eq 200 ]; then
        echo "User is a member of the QA group"
        ############# Auto Merge #######################
        echo "Merging MR ID: $CI_MERGE_REQUEST_IID for project: $CI_PROJECT_ID ..."
        curl --request PUT "https://gitlab-ce.lgcomus-shared.lge.com/api/v4/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/merge" \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --header "Content-Type: application/json" \
        --data '{
           "merge_when_pipeline_succeeds": true
        }'

        #echo "Merge Response: $MERGE_RESPONSE"
        echo "MR merged successfully if no error above."
      else
        echo "User is not a member of the QA group"
        exit 1
      fi
  allow_failure: false

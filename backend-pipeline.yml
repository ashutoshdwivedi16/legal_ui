.deploy-script-before: &deploy-script-before
  - apk add --no-cache yq coreutils
  - curl -LO https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
  - chmod +x ./kubectl-argo-rollouts-linux-amd64
  - export EKS_CLUSTER_NAME=$(eval echo \${EKS_CLUSTER_NAME_$CI_ENVIRONMENT_NAME})
  - aws eks update-kubeconfig --name ${EKS_CLUSTER_NAME} --region ${AWS_DEFAULT_REGION}
  - |
    DOCKER_REGISTRY_SHARED="$DOCKER_REGISTRY_SHARED"
    if [[ "$CI_ENVIRONMENT_NAME" == "dr" ]]; then
      DOCKER_REGISTRY_SHARED=$(echo "$DOCKER_REGISTRY_SHARED" | sed 's/us-east-1/us-west-2/')
    fi
  - export IMAGE_NAME=${DOCKER_REGISTRY_SHARED}:${APP_NAME}-${CI_COMMIT_SHORT_SHA}-${DOCKER_TAG}

.common-deployment-lower-env-steps: &common-deployment-lower-env-steps
  - >
    if [ -n "$ENV_NUM" ]; then
      sed -i "s,ENV_JAVA_OPTS,$(echo -n "$ENV_JAVA_OPTS" | sed "s/${ENV}/${ENV}_NUM/"),g" manifests/${CI_ENVIRONMENT_NAME}_env/secret.yaml
      sed -i "s,ENV_BRANCH_NUM,${ENV_NUM},g" manifests/${CI_ENVIRONMENT_NAME}_env/secret.yaml
    else
      sed -i "s,ENV_JAVA_OPTS,${ENV_JAVA_OPTS},g" manifests/${CI_ENVIRONMENT_NAME}/secret.yaml
    fi
  - >
    if [ -n "$STORE_CODE" ]; then
      sed -i "s,ENV_STORE_PATH,${STORE_CODE},g" manifests/${CI_ENVIRONMENT_NAME}/secret.yaml
      sed -i "s,ENV_STORE_PATH,${STORE_CODE},g" manifests/${CI_ENVIRONMENT_NAME}_env/secret.yaml
    fi

.common-deployment-manifest-fetch-script: &common-deployment-manifest-fetch-script
  - >
      curl --header "PRIVATE-TOKEN: ${GIT_API_TOKEN}" --url "$HELM_URL" --output microservice_helm.tar.gz
  - apk add --no-cache tar gzip
  - tar -xvzf ./microservice_helm.tar.gz

.common-deployment-copy-secret-file-script: &common-deployment-copy-secret-file-script
  - >
    if [ -n "$ENV_NUM" ]; then
      cp manifests/${CI_ENVIRONMENT_NAME}_env/secret.yaml ./common-pipeline-configuration-*/shared/helm-microservice/templates/
    else
      cp manifests/${CI_ENVIRONMENT_NAME}/secret.yaml ./common-pipeline-configuration-*/shared/helm-microservice/templates/
    fi

.deploy-script-checks-before:
  script:
    - |
      if [ -n "$STORE_CODE" ]; then
        ARGO_ROLLOUT_LIST_BEFORE=$(./kubectl-argo-rollouts-linux-amd64 list rollouts -n ${APP_NAMESPACE} 2>/dev/null|{ grep ${APP_NAME}-${STORE_CODE}-${CI_ENVIRONMENT_NAME} || true; }|wc -l) 
          if [ "${ARGO_ROLLOUT_LIST_BEFORE}" -eq 1 ]; then \
            ./kubectl-argo-rollouts-linux-amd64 get rollout ${APP_NAME}-${STORE_CODE}-${CI_ENVIRONMENT_NAME} -n ${APP_NAMESPACE} ;
          fi ;
      else
        ARGO_ROLLOUT_LIST_BEFORE=$(./kubectl-argo-rollouts-linux-amd64 list rollouts -n ${APP_NAMESPACE} 2>/dev/null|{ grep ${APP_NAME}-${CI_ENVIRONMENT_NAME} || true; }|wc -l) 
          if [ "${ARGO_ROLLOUT_LIST_BEFORE}" -eq 1 ]; then \
            ./kubectl-argo-rollouts-linux-amd64 get rollout ${APP_NAME}-${CI_ENVIRONMENT_NAME} -n ${APP_NAMESPACE} ;
          fi ;
        fi;

.deploy-script-checks:
  script:
    - |
      if [ -n "$STORE_CODE" ]; then
        ARGO_ROLLOUT_LIST=$(./kubectl-argo-rollouts-linux-amd64 list rollouts -n ${APP_NAMESPACE} 2>/dev/null|{ grep ${APP_NAME}-$STORE_CODE || true; }|wc -l)
        echo "${ARGO_ROLLOUT_LIST}"
          if [ "${ARGO_ROLLOUT_LIST}" -eq 1 ]; then \
            ARGO_ROLLOUT_COUNTER=0 ;
            while [  "${ARGO_ROLLOUT_COUNTER}" -lt 10 ]; do \
              ARGO_ROLLOUT_STATUS=$(./kubectl-argo-rollouts-linux-amd64 get rollout ${APP_NAME}-$STORE_CODE-${CI_ENVIRONMENT_NAME} -n ${APP_NAMESPACE}|grep Status|{ grep Healthy || true; }|wc -l) ;
              if [ "${ARGO_ROLLOUT_STATUS}" -eq 0 ]; then \
                ./kubectl-argo-rollouts-linux-amd64 get rollout ${APP_NAME}-$STORE_CODE-${CI_ENVIRONMENT_NAME} -n ${APP_NAMESPACE} ;
                ARGO_ROLLOUT_COUNTER=$((ARGO_ROLLOUT_COUNTER+1)) ;
                sleep 30 ;
              else \
                ./kubectl-argo-rollouts-linux-amd64 get rollout ${APP_NAME}-$STORE_CODE-${CI_ENVIRONMENT_NAME} -n ${APP_NAMESPACE} ;
                ARGO_ROLLOUT_COUNTER=100 ;
              fi ;
            done ;
          fi ;
      else
        ARGO_ROLLOUT_LIST=$(./kubectl-argo-rollouts-linux-amd64 list rollouts -n ${APP_NAMESPACE} 2>/dev/null|{ grep ${APP_NAME} || true; }|wc -l)
        echo "${ARGO_ROLLOUT_LIST}"
          if [ "${ARGO_ROLLOUT_LIST}" -eq 1 ]; then \
            ARGO_ROLLOUT_COUNTER=0 ;
            while [  "${ARGO_ROLLOUT_COUNTER}" -lt 10 ]; do \
              ARGO_ROLLOUT_STATUS=$(./kubectl-argo-rollouts-linux-amd64 get rollout ${APP_NAME}-${CI_ENVIRONMENT_NAME} -n ${APP_NAMESPACE}|grep Status|{ grep Healthy || true; }|wc -l) ;
              if [ "${ARGO_ROLLOUT_STATUS}" -eq 0 ]; then \
                ./kubectl-argo-rollouts-linux-amd64 get rollout ${APP_NAME}-${CI_ENVIRONMENT_NAME} -n ${APP_NAMESPACE} ;
                ARGO_ROLLOUT_COUNTER=$((ARGO_ROLLOUT_COUNTER+1)) ;
                sleep 30 ;
              else \
                ./kubectl-argo-rollouts-linux-amd64 get rollout ${APP_NAME}-${CI_ENVIRONMENT_NAME} -n ${APP_NAMESPACE} ;
                ARGO_ROLLOUT_COUNTER=100 ;
              fi ;
            done ;
          fi ;
        fi;


.common-deployment-helm-upgrade-script:
  script:
    - cat values.yaml
    - |
      if [ -n "$ENV_NUM" ]; then
        IS_FIRST_TIME_ENV=$([ $(helm list -n ${APP_NAMESPACE}-${ENV_NUM} | grep ${resource_name} | wc -l) -eq 1 ] && echo "false" || echo "true")
        if [ "$IS_FIRST_TIME_ENV" = "false" ]; then
          cd ../ && helm upgrade ${resource_name} helm-microservice/ --values helm-microservice/values.yaml --namespace $APP_NAMESPACE-$ENV_NUM;
        else
          if [ "$CI_ENVIRONMENT_NAME" = "dev" ] || [ "$CI_ENVIRONMENT_NAME" = "qa" ]; then
            IS_KUBERNETES_RESOURCE_AVAILABLE=$([ $(kubectl get deployment ${resource_name} -n ${APP_NAMESPACE}-${ENV_NUM} --no-headers | wc -l) -eq 1 ] && echo "true" || echo "false")
            if [ "$IS_KUBERNETES_RESOURCE_AVAILABLE" = "true" ]; then
              kubectl delete deployment ${resource_name} -n ${APP_NAMESPACE}-${ENV_NUM}
              kubectl delete ingress ${resource_name} -n ${APP_NAMESPACE}-${ENV_NUM}
              kubectl delete service ${resource_name} -n ${APP_NAMESPACE}-${ENV_NUM}
            fi
          else
            IS_KUBERNETES_RESOURCE_AVAILABLE=$([ $(kubectl get rollout ${resource_name} -n ${APP_NAMESPACE}-${ENV_NUM} --no-headers | wc -l) -eq 1 ] && echo "true" || echo "false")
            if [ "$IS_KUBERNETES_RESOURCE_AVAILABLE" = "true" ]; then
              kubectl delete rollout ${resource_name} -n ${APP_NAMESPACE}-${ENV_NUM}
              kubectl delete hpa ${resource_name} -n ${APP_NAMESPACE}-${ENV_NUM}
              kubectl delete ingress ${resource_name} -n ${APP_NAMESPACE}-${ENV_NUM}
              kubectl delete service ${resource_name} -n ${APP_NAMESPACE}-${ENV_NUM}
              kubectl delete secret ${resource_name} -n ${APP_NAMESPACE}-${ENV_NUM}
            fi
          fi
          cd ../ && helm install ${resource_name} helm-microservice/ --values helm-microservice/values.yaml --namespace $APP_NAMESPACE-$ENV_NUM;
        fi
      else
        IS_FIRST_TIME=$([ $(helm list -n ${APP_NAMESPACE} | grep ${resource_name} | wc -l) -eq 1 ] && echo "false" || echo "true")
        if [ "$IS_FIRST_TIME" = "false" ]; then
          cd ../ && helm upgrade ${resource_name} helm-microservice/ --values helm-microservice/values.yaml --namespace $APP_NAMESPACE;
        else
          touch helm.log
          if [ "$CI_ENVIRONMENT_NAME" = "dev" ] || [ "$CI_ENVIRONMENT_NAME" = "qa" ]; then
            IS_KUBERNETES_RESOURCE_AVAILABLE=$([ $(kubectl get deployment ${resource_name} -n ${APP_NAMESPACE} --no-headers | wc -l) -eq 1 ] && echo "true" || echo "false")
            echo "$IS_KUBERNETES_RESOURCE_AVAILABLE" > helm.log
            if [ "$IS_KUBERNETES_RESOURCE_AVAILABLE" = "true" ]; then
              kubectl delete deployment ${resource_name} -n ${APP_NAMESPACE}
              kubectl delete ingress ${resource_name} -n ${APP_NAMESPACE}
              kubectl delete service ${resource_name} -n ${APP_NAMESPACE}
            fi
          else
            IS_KUBERNETES_RESOURCE_AVAILABLE=$([ $(kubectl get rollout ${resource_name} -n ${APP_NAMESPACE} --no-headers | wc -l) -eq 1 ] && echo "true" || echo "false")
            if [ "$IS_KUBERNETES_RESOURCE_AVAILABLE" = "true" ]; then
              kubectl delete rollout ${resource_name} -n ${APP_NAMESPACE}
              kubectl delete hpa ${resource_name} -n ${APP_NAMESPACE}
              kubectl delete ingress ${resource_name} -n ${APP_NAMESPACE}
              kubectl delete service ${resource_name} -n ${APP_NAMESPACE}
              kubectl delete service ${resource_name}-preview -n ${APP_NAMESPACE}
              kubectl delete secret ${resource_name}-secret -n ${APP_NAMESPACE}
            fi
          fi
          cd ../ && helm install ${resource_name} helm-microservice/ --values helm-microservice/values.yaml --namespace $APP_NAMESPACE;
        fi
      fi
    - cd "${CI_PROJECT_DIR}"
    - pwd
    - POD_NAME=$resource_name
    - echo "$POD_NAME"
    - sleep 60
    - |
      POD_STATUS=$(kubectl get pods -n ${APP_NAMESPACE} -o=json | jq -r '.items[] | select(.metadata.name | contains("'${POD_NAME}-'")) | .metadata.name' | xargs -I {} kubectl get pod {} -n ${APP_NAMESPACE} -o=json | jq '.status.containerStatuses[] | select(.state.waiting != null and (.state.waiting.reason | test("Error|CrashLoopBackOff|ErrImagePull|ImagePullBackOff|ErrImageNeverPull|CreateContainerConfigError|CreateContainerError"))) | {name: .name, namespace: "'${APP_NAMESPACE}'", reason: .state.waiting.reason}')
    - echo "$POD_STATUS"
    - echo "$POD_STATUS" > podstatus.json
    - export POD_STATUS=$(grep 'reason:*' podstatus.json | tail -1 | awk '{print$2}' | sed 's/\"//g')
    - echo $POD_STATUS
    - if [ "$POD_STATUS" = "CrashLoopBackOff" ] || [ "$POD_STATUS" = "Error" ] || [ "$POD_STATUS" = "ErrImagePull" ] || [ "$POD_STATUS" = "ImagePullBackOff" ] || [ "$POD_STATUS" = "ErrImageNeverPull" ] || [ "$POD_STATUS" = "CreateContainerConfigError" ] || [ "$POD_STATUS" = "CreateContainerError" ]; then echo pod is not in Running state; exit 1; fi ;
    - |
      if [ "$CI_ENVIRONMENT_NAME" = "prd" ]; then
        echo "Environment is production. Proceeding with New Relic deployment notification."

        # Validate required environment variables
        if [ -z "$API_KEY" ]; then
          echo "RROR: API_KEY is not set."
          exit 1
        fi

        if [ -z "$resource_name" ] || [ -z "$APP_NAMESPACE" ]; then
          echo "ERROR: resource_name or APP_NAMESPACE is not set."
          exit 1
        fi

        # Fetch the New Relic application name from Kubernetes secret
        NR_APP_NAME=$(kubectl get secret "$resource_name" -n "$APP_NAMESPACE" -o jsonpath="{.data.NEW_RELIC_APP_NAME}" | base64 -d 2>/dev/null)

        if [ -z "$NR_APP_NAME" ]; then
          echo "ERROR: Failed to retrieve NEW_RELIC_APP_NAME from Kubernetes secret."
          exit 1
        fi

        echo "Retrieved New Relic App Name: $NR_APP_NAME"

        # Fetch the application ID from New Relic
        NR_APP_ID=$(curl -s -X GET "https://api.newrelic.com/v2/applications.json" \
          -H "X-Api-Key:$API_KEY" -H -i -d "filter[name]=$NR_APP_NAME" | jq '.applications[0].id')

        if [ -z "$NR_APP_ID" ]; then
          echo "ERROR: Could not find matching application ID for '$NR_APP_NAME' in New Relic."
          exit 1
        fi

        echo "Retrieved New Relic App ID: $NR_APP_ID"
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        curl -X POST "https://api.newrelic.com/v2/applications/$NR_APP_ID/deployments.json" -H "X-Api-Key:$API_KEY" -H "Content-Type: application/json" -d "{ \"deployment\": { \"revision\": \"test\", \"changelog\": \"Deployment\", \"description\": \"Record Deployment\", \"timestamp\": \"$TIMESTAMP\" }}"
      fi
.dcoker-image-scanning-script: &dcoker-image-scanning-script
  - aws ecr start-image-scan --repository-name ${ECR_REPO_NAME_SHARED} --image-id imageTag=${APP_NAME}-${CI_COMMIT_SHORT_SHA}-${DOCKER_TAG} --region $AWS_DEFAULT_REGION
  - aws ecr wait image-scan-complete --repository-name ${ECR_REPO_NAME_SHARED} --image-id imageTag=${APP_NAME}-${CI_COMMIT_SHORT_SHA}-${DOCKER_TAG} --cli-read-timeout 300 --cli-connect-timeout 300
  - aws ecr describe-image-scan-findings --repository-name ${ECR_REPO_NAME_SHARED} --image-id imageTag=${APP_NAME}-${CI_COMMIT_SHORT_SHA}-${DOCKER_TAG} --region $AWS_DEFAULT_REGION > scanfindings
  - export VAR_HIGH=$(grep 'HIGH:*' scanfindings | tail -1 | awk '{print$2}' | sed -e 's/,/ /g')
  ##### We will change the value 1 to 0 for VAR_HIGH when java 21 will enable in all projects####
  - if [ $VAR_HIGH -gt 1 ]; then HIGH=$VAR_HIGH; fi
  - export HIGH_IMAGESCAN_VALUE=$HIGH
  - if [ "$HIGH_IMAGESCAN_VALUE" -ge "$IMAGE_SCAN_MIN_HIGH_PASS_VALUE" ]; then echo ${IMAGESCANFAILMESSAGE} SACN VALUE IS ${HIGH_IMAGESCAN_VALUE}; exit 1; fi ;
  ##CRITICAL Vunlarablity Scan
  - export VAR_CRITICAL=$(grep 'CRITICAL:*' scanfindings | tail -1 | awk '{print$2}' | sed -e 's/,/ /g')
  #- echo $VAR_CRITICAL
  #- cat scanfindings
  - if [ $VAR_CRITICAL -gt 0 ]; then CRITICAL=$VAR_CRITICAL; fi
  - export CRITICAL_IMAGESCAN_VALUE=$CRITICAL
  - if [ "$CRITICAL_IMAGESCAN_VALUE" -ge "$IMAGE_SCAN_MIN_CRITICAL_PASS_VALUE" ]; then echo ${IMAGESCANFAILMESSAGE} SACN VALUE IS ${CRITICAL_IMAGESCAN_VALUE}; exit 1; fi ; 
.db-secret-manager-script: &db-secret-manager-script

    - sleep 5
    - aws s3 cp ${APP_NAME}-${CI_ENVIRONMENT_NAME}.json s3://swagger.lgcomus-${CI_ENVIRONMENT_NAME}.lge.com/


unit-test:
  stage: unit-testing
  image: 076614340621.dkr.ecr.us-east-1.amazonaws.com/lgcomus-base-gradle-jdk-shared:java_v21
  rules:
  - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^lower-dev-sync\/.*$/'
    when: never
  - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^lower-qa-sync\/.*$/'
    when: never
  - if: >
      $CI_PIPELINE_SOURCE != "web" &&
      (
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" ||
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release" ||
        $CI_COMMIT_BRANCH == "develop" ||
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release-.*$/ ||
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^develop-.*$/
      )
    changes:
      - backend/**/*
    when: always
  - if: >
      $CI_PIPELINE_SOURCE == "web" &&
      ($JOB_NAME == "BE" || $JOB_NAME == "ALL") &&
      $CI_COMMIT_BRANCH == "develop"
    when: always
  - when: never
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/test/**/TEST-*.xml
    paths:
      - backend/build/test-results/test/**/TEST-*.xml
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
  script:
    - cd backend
    - chmod +x ./gradlew
    - ./gradlew test
    - export JUNITRESULT_VALUE=$(grep -o 'failures="0"' backend/build/test-results/test/TEST-* | wc -l)
    - if [ "$JUNITRESULT_VALUE" -ge "$JUNIT_MIN_PASS_VALUE" ]; then exit 0; else exit 1; fi

sonarqube-check:
  stage: sonar-scanner
  image: 076614340621.dkr.ecr.us-east-1.amazonaws.com/lgcomus-base-gradle-jdk-shared:java_v21
  rules:
  - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^lower-dev-sync\/.*$/'
    when: never
  - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^lower-qa-sync\/.*$/'
    when: never
  - if: >
      $CI_PIPELINE_SOURCE != "web" &&
      (
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" ||
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release" ||
        $CI_COMMIT_BRANCH == "develop" ||
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release-.*$/ ||
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^develop-.*$/
      )
    changes:
      - backend/**/*
    when: always
  - if: >
      $CI_PIPELINE_SOURCE == "web" &&
      ($JOB_NAME == "BE" || $JOB_NAME == "ALL") &&
      $CI_COMMIT_BRANCH == "develop"
    when: always
  - when: never
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/backend/.sonar"
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .backend/sonar/cache
  script:
    - cd backend
    - chmod +x ./gradlew
    - ./gradlew sonarqube -Dsonar.projectVersion=${CI_COMMIT_SHORT_SHA} -Dsonar.qualitygate.timeout=900 -Dsonar.projectName=${SONAR_PROJECT_NAME} -Dsonar.projectKey=${SONAR_PROJECT_NAME} -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.login=${SONAR_TOKEN} -Dsonar.qualitygate.wait=true


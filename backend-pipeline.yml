Check_Any_Openmr_To_Main_For_STG:
  image: 076614340621.dkr.ecr.us-east-1.amazonaws.com/lgcomus-base-docker-shared:alpine-3.9-auto-merge
  before_script: [] # We do not need any setup work, let's remove the global one (if any)
  variables:
    GIT_STRATEGY: clone 
  stage: check_commit
  when: manual
  only:
    - release
    - /^release-.*$/
    - /^hotfix\/[A-Za-z]+-\d+$/
    - hotfix/stg-production
    - release-b2b
    - /^release-b2b-.*$/
    - /^hotfix\/b2b-[A-Za-z]+-\d+$/
    - hotfix/b2b-stg-production
  except:
    - release-dr
  script:
    - export GITLAB_PRIVATE_TOKEN=$(aws secretsmanager get-secret-value --secret-id SECRET-LGCOMUS-GITLAB-TOKEN --region us-east-1 --query SecretString --output text | jq '.GITLAB_PRIVATE_TOKEN'|sed 's/"//g')
    - touch ./check_open_mr_main.sh
    - cat $CHECK_OPEN_MR_SCRIPT >> ./check_open_mr_main.sh
    - chmod +x check_open_mr_main.sh
    - ./check_open_mr_main.sh >> check_open_mr_main.txt
    
    - export MAIN_BRANCH_MR=$(cat check_open_mr_main.txt | grep "notopen" | wc -l)
    - echo $MAIN_BRANCH_MR
    - if [ $MAIN_BRANCH_MR = "0" ]; then echo MR is open for main branch; exit 1; fi
    - echo "No Opem MR found for main branch"

Main_Branch_Commit:
  image: 076614340621.dkr.ecr.us-east-1.amazonaws.com/lgcomus-base-docker-shared:alpine-3.9-auto-merge
  before_script: []
  variables:
    GIT_STRATEGY: clone 
  stage: check_commit
  when: manual
  only:
    - release
    - /^release-.*$/
    - /^hotfix\/[A-Za-z]+-\d+$/
    - hotfix/stg-production
    - release-b2b
    - /^release-b2b-.*$/
    - /^hotfix\/b2b-[A-Za-z]+-\d+$/
    - hotfix/b2b-stg-production
  except:
    - release-dr
  needs: [Check_Any_Openmr_To_Main_For_STG]
  script:
    - export GITLAB_PRIVATE_TOKEN=$(aws secretsmanager get-secret-value --secret-id SECRET-LGCOMUS-GITLAB-TOKEN --region us-east-1 --query SecretString --output text | jq '.GITLAB_PRIVATE_TOKEN'|sed 's/"//g')
    - rm -rf ./check-commit.sh
    - touch ./check-commit.sh
    - cat $CHECK_COMMIT >> ./check-commit.sh
    - chmod +x check-commit.sh
    - ./check-commit.sh >> check-commit.txt
    - export LAST_PROD_COMMIT_COUNT=$(cat check-commit.txt  | grep "found" | wc -l)
    - echo $LAST_PROD_COMMIT_COUNT
    - if [ $LAST_PROD_COMMIT_COUNT = "0" ]; then exit 1; fi

image: 076614340621.dkr.ecr.us-east-1.amazonaws.com/lgcomus-base-docker-shared:latest

.deploy-script-before: &deploy-script-before
    - apk add --no-cache yq coreutils
    - curl -LO https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
    - chmod +x ./kubectl-argo-rollouts-linux-amd64
    - export EKS_CLUSTER_NAME=$(eval echo \${EKS_CLUSTER_NAME_$CI_ENVIRONMENT_NAME})
    - aws eks update-kubeconfig --name ${EKS_CLUSTER_NAME} --region ${AWS_DEFAULT_REGION}
    - |
      DOCKER_REGISTRY_SHARED="$DOCKER_REGISTRY_SHARED"

.common-before-docker-image-script: &common-before-docker-image-script
  - docker info
  - apk add --no-cache zip
  - apk add --no-cache curl jq python3 py3-pip
  - pip3 install awscli
  - export AWS_PROFILE=lgcomus-shared
  - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 076614340621.dkr.ecr.us-east-1.amazonaws.com
.common-docker-image-script: &common-docker-image-script
  - echo ${DOCKER_REGISTRY_SHARED}:${APP_NAME}-${CI_COMMIT_SHORT_SHA}-${DOCKER_TAG}
  - export IMAGE_NAME=${DOCKER_REGISTRY_SHARED}:${APP_NAME}-${CI_COMMIT_SHORT_SHA}-${DOCKER_TAG}
  - echo ${IMAGE_NAME}
  - docker build -t ${IMAGE_NAME} .
  - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $DOCKER_REGISTRY_SHARED
  - docker tag ${IMAGE_NAME} ${IMAGE_NAME}
  - docker push ${IMAGE_NAME}

.dcoker-image-scanning-script: &dcoker-image-scanning-script
  - aws ecr start-image-scan --repository-name ${ECR_REPO_NAME_SHARED} --image-id imageTag=${APP_NAME}-${CI_COMMIT_SHORT_SHA}-${DOCKER_TAG} --region $AWS_DEFAULT_REGION
  - aws ecr wait image-scan-complete --repository-name ${ECR_REPO_NAME_SHARED} --image-id imageTag=${APP_NAME}-${CI_COMMIT_SHORT_SHA}-${DOCKER_TAG} --cli-read-timeout 300 --cli-connect-timeout 300
  - aws ecr describe-image-scan-findings --repository-name ${ECR_REPO_NAME_SHARED} --image-id imageTag=${APP_NAME}-${CI_COMMIT_SHORT_SHA}-${DOCKER_TAG} --region $AWS_DEFAULT_REGION > scanfindings
  - export VAR_HIGH=$(grep 'HIGH:*' scanfindings | tail -1 | awk '{print$2}' | sed -e 's/,/ /g')
  ##### We will change the value 1 to 0 for VAR_HIGH when java 21 will enable in all projects####
  - if [ $VAR_HIGH -gt 1 ]; then HIGH=$VAR_HIGH; fi
  - export HIGH_IMAGESCAN_VALUE=$HIGH
  - if [ "$HIGH_IMAGESCAN_VALUE" -ge "$IMAGE_SCAN_MIN_HIGH_PASS_VALUE" ]; then echo ${IMAGESCANFAILMESSAGE} SACN VALUE IS ${HIGH_IMAGESCAN_VALUE}; exit 1; fi ;
  ##CRITICAL Vunlarablity Scan
  - export VAR_CRITICAL=$(grep 'CRITICAL:*' scanfindings | tail -1 | awk '{print$2}' | sed -e 's/,/ /g')
  #- echo $VAR_CRITICAL
  #- cat scanfindings
  - if [ $VAR_CRITICAL -gt 0 ]; then CRITICAL=$VAR_CRITICAL; fi
  - export CRITICAL_IMAGESCAN_VALUE=$CRITICAL
  - if [ "$CRITICAL_IMAGESCAN_VALUE" -ge "$IMAGE_SCAN_MIN_CRITICAL_PASS_VALUE" ]; then echo ${IMAGESCANFAILMESSAGE} SACN VALUE IS ${CRITICAL_IMAGESCAN_VALUE}; exit 1; fi ; 

.deploy-script: &deploy-script
  - export AWS_PROFILE=lgcomus-${CI_ENVIRONMENT_NAME}
  - export EKS_CLUSTER_NAME=$(eval echo \${EKS_CLUSTER_NAME_$CI_ENVIRONMENT_NAME})
  - aws eks update-kubeconfig --name ${EKS_CLUSTER_NAME} --region ${AWS_DEFAULT_REGION}


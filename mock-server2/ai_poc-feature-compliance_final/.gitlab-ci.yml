.common-deploy-script: &common-deploy-script
  - export IMAGE_NAME=${DOCKER_REGISTRY_SHARED}:${APP_NAME}-${CI_COMMIT_SHORT_SHA}-${DOCKER_TAG}
  - sed -i "s,IMAGE_VERSION,${IMAGE_NAME},g" manifests/${CI_ENVIRONMENT_NAME}/deployment.yaml
  - kubectl apply -f manifests/${CI_ENVIRONMENT_NAME}/secret.yaml
  - kubectl apply -f manifests/${CI_ENVIRONMENT_NAME}/deployment.yaml
  - kubectl apply -f manifests/${CI_ENVIRONMENT_NAME}/service.yaml
  - kubectl apply -f manifests/${CI_ENVIRONMENT_NAME}/ingress.yaml
  - POD_NAME=$(yq eval '.spec.template.spec.containers[0].name' manifests/${CI_ENVIRONMENT_NAME}/deployment.yaml)
  - echo "$POD_NAME"
  - sleep 30
  - |
    POD_STATUS=$(kubectl get pods -n ${APP_NAMESPACE} -o=json | jq -r '.items[] | select(.metadata.name | contains("'${POD_NAME}-'")) | .metadata.name' | xargs -I {} kubectl get pod {} -n ${APP_NAMESPACE} -o=json | jq '.status.containerStatuses[] | select(.state.waiting != null and (.state.waiting.reason | test("Error|CrashLoopBackOff|ErrImagePull|ImagePullBackOff|ErrImageNeverPull|CreateContainerConfigError|CreateContainerError"))) | {name: .name, namespace: "'${APP_NAMESPACE}'", reason: .state.waiting.reason}')
  - echo "$POD_STATUS"
  - echo "$POD_STATUS" > podstatus.json
  - export POD_STATUS=$(grep 'reason:*' podstatus.json | tail -1 | awk '{print$2}' | sed 's/\"//g')
  - echo $POD_STATUS
  - if [ "$POD_STATUS" = "CrashLoopBackOff" ] || [ "$POD_STATUS" = "Error" ] || [ "$POD_STATUS" = "ErrImagePull" ] || [ "$POD_STATUS" = "ImagePullBackOff" ] || [ "$POD_STATUS" = "ErrImageNeverPull" ] || [ "$POD_STATUS" = "CreateContainerConfigError" ] || [ "$POD_STATUS" = "CreateContainerError" ]; then echo pod is not in Running state; exit 1; fi ;

.common-deploy-stg-prd-script: &common-deploy-stg-prd-script
  - export IMAGE_NAME=${DOCKER_REGISTRY}:${APP_NAME}-${CI_COMMIT_SHORT_SHA}-${DOCKER_TAG}
  - sed -i "s,IMAGE_VERSION,${IMAGE_NAME},g" manifests/${CI_ENVIRONMENT_NAME}/argo_rollouts.yaml
  - sed -i "s,MAX_REPLICAS,${MAX_REPLICAS},g" manifests/${CI_ENVIRONMENT_NAME}/hpa.yaml
  - sed -i "s,MIN_REPLICAS,${MIN_REPLICAS},g" manifests/${CI_ENVIRONMENT_NAME}/hpa.yaml
  - sed -i "s,MIN_REPLICAS,${MIN_REPLICAS},g" manifests/${CI_ENVIRONMENT_NAME}/argo_rollouts.yaml
  - sed -i "s,CPU_LIMIT,${CPU_LIMIT},g" manifests/${CI_ENVIRONMENT_NAME}/argo_rollouts.yaml
  - sed -i "s,MEMORY_LIMIT,${MEMORY_LIMIT},g" manifests/${CI_ENVIRONMENT_NAME}/argo_rollouts.yaml
  - sed -i "s,MEMORY_REQUEST,${MEMORY_REQUEST},g" manifests/${CI_ENVIRONMENT_NAME}/argo_rollouts.yaml
  - sed -i "s,CPU_REQUEST,${CPU_REQUEST},g" manifests/${CI_ENVIRONMENT_NAME}/argo_rollouts.yaml
  - kubectl apply -f manifests/${CI_ENVIRONMENT_NAME}/secret.yaml
  - kubectl apply -f manifests/${CI_ENVIRONMENT_NAME}/argo_rollouts.yaml
  - kubectl apply -f manifests/${CI_ENVIRONMENT_NAME}/service.yaml
  - kubectl apply -f manifests/${CI_ENVIRONMENT_NAME}/hpa.yaml
  - kubectl apply -f manifests/${CI_ENVIRONMENT_NAME}/ingress.yaml
  - POD_NAME=$(yq eval '.spec.template.spec.containers[0].name' manifests/${CI_ENVIRONMENT_NAME}/argo_rollouts.yaml)
  - echo "$POD_NAME"
  - sleep 30
  - |
    POD_STATUS=$(kubectl get pods -n ${APP_NAMESPACE} -o=json | jq -r '.items[] | select(.metadata.name | contains("'${POD_NAME}-'")) | .metadata.name' | xargs -I {} kubectl get pod {} -n ${APP_NAMESPACE} -o=json | jq '.status.containerStatuses[] | select(.state.waiting != null and (.state.waiting.reason | test("Error|CrashLoopBackOff|ErrImagePull|ImagePullBackOff|ErrImageNeverPull|CreateContainerConfigError|CreateContainerError"))) | {name: .name, namespace: "'${APP_NAMESPACE}'", reason: .state.waiting.reason}')
  - echo "$POD_STATUS"
  - echo "$POD_STATUS" > podstatus.json
  - export POD_STATUS=$(grep 'reason:*' podstatus.json | tail -1 | awk '{print$2}' | sed 's/\"//g')
  - echo $POD_STATUS
  - if [ "$POD_STATUS" = "CrashLoopBackOff" ] || [ "$POD_STATUS" = "Error" ] || [ "$POD_STATUS" = "ErrImagePull" ] || [ "$POD_STATUS" = "ImagePullBackOff" ] || [ "$POD_STATUS" = "ErrImageNeverPull" ] || [ "$POD_STATUS" = "CreateContainerConfigError" ] || [ "$POD_STATUS" = "CreateContainerError" ]; then echo pod is not in Running state; exit 1; fi ;


stages:
  - dev-docker-image
  - dev-deploy
  - qa-docker-image
  - qa-deploy
  - stg-deploy
  - prd-deploy

dev_docker_image:
  stage: dev-docker-image
  environment:
    name: dev
  only:
    - develop
  before_script:
    - *common-before-docker-image-script
  script:
    - *common-docker-image-script
    - *dcoker-image-scanning-script

DEV_Deploy:
  stage: dev-deploy
  environment:
    name: dev
  only:
    - develop
  needs: [dev_docker_image]
  image: 076614340621.dkr.ecr.us-east-1.amazonaws.com/lgcomus-base-helm-shared:latest-mfe
  before_script:
    - export AWS_PROFILE=lgcomus-${CI_ENVIRONMENT_NAME}
    - export ENV=DEV
    - *deploy-script-before
  script:
    - *fetch-secret-manager-script
    - *secret-manager-replace-script
    - *deploy-script
    - *common-deploy-script
  allow_failure: false

qa_docker_image:
  stage: qa-docker-image
  environment:
    name: qa
  only:
    - release
  before_script:
    - *common-before-docker-image-script
  script:
    - *common-docker-image-script
    - *dcoker-image-scanning-script

qa_deploy:
  stage: qa-deploy
  environment:
    name: qa
  only:
    - release
  needs: [qa_docker_image]
  image: 076614340621.dkr.ecr.us-east-1.amazonaws.com/lgcomus-base-helm-shared:latest-mfe
  before_script:
    - export AWS_PROFILE=lgcomus-${CI_ENVIRONMENT_NAME}
    - export ENV=QA
    - *deploy-script-before
  script:
    - *fetch-secret-manager-script
    - *secret-manager-replace-script
    - *deploy-script
    - *common-deploy-script
  allow_failure: false

stg_deploy:
  stage: stg-deploy
  environment:
    name: stg
  only:
    - release
  when: manual
  needs: [qa_deploy]
  image: 076614340621.dkr.ecr.us-east-1.amazonaws.com/lgcomus-base-helm-shared:latest-mfe
  before_script:
    - export AWS_PROFILE=lgcomus-${CI_ENVIRONMENT_NAME}
    - export ENV=STG
    - *deploy-script-before
  script:
    - *fetch-secret-manager-script
    - *secret-manager-replace-script
    - *deploy-script
    - *common-deploy-stg-prd-script
  allow_failure: false

PRD_Deploy:
  stage: prd-deploy
  environment:
    name: prd
  only:
    - release
  when: manual
  needs: [stg_deploy]
  image: 076614340621.dkr.ecr.us-east-1.amazonaws.com/lgcomus-base-helm-shared:latest-mfe
  before_script:
    - export AWS_PROFILE=lgcomus-${CI_ENVIRONMENT_NAME}
    - export ENV=PRD
    - *deploy-script-before
  script:
    - *fetch-secret-manager-script
    - *secret-manager-replace-script
    - *deploy-script
    - *common-deploy-stg-prd-script
  allow_failure: false
